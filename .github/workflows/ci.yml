name: CORTEX checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cortex_test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: cortex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cortex_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://cortex_test:test-only-ci-password@localhost:5432/cortex_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: docker build -t cortex:ci .
